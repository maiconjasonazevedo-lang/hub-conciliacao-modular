<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Amazon Parser Validation (SANITIZED)</title>
</head>
<body>
<pre id="output"></pre>
<script src="js/services/amazon/amazonTransactionParsers.js"></script>
<script src="js/services/amazon/amazonSettlementParsers.js"></script>
<script>
// SANITIZED validation harness: contains no real transaction or settlement data.
const sampleTx = 'SAMPLE_TRANSACTION_REPORT_CONTENT';
const sampleSett = 'SAMPLE_SETTLEMENT_CONTENT';
const output = document.getElementById('output');
function log(msg) { output.textContent += msg + '\n'; }
try {
  log('parser tx ok: ' + (typeof parseAmazonTransactionReport === 'function'));
  log('parser settle ok: ' + (typeof parseAmazonSettlement === 'function'));
  const txSource = sampleTx;
  const settSource = sampleSett;
  if (typeof parseAmazonTransactionReport === 'function') {
    try {
      const txResult = parseAmazonTransactionReport(txSource, { fileName: 'sample-transaction.csv' });
      log('TX rows=' + (txResult && txResult.rawRows ? txResult.rawRows.length : 0) + ' events=' + (txResult && txResult.events ? txResult.events.length : 0));
    } catch (e) { log('TX ERROR: ' + e.message); }
  }
  if (typeof parseAmazonSettlement === 'function') {
    try {
      const settResult = parseAmazonSettlement(settSource, { fileName: 'sample-settlement.csv' });
      log('SET rows=' + (settResult && settResult.rows ? settResult.rows.length : 0) + ' total=' + (settResult && settResult.summary ? settResult.summary.totalAmount : 0));
    } catch (e) { log('SET ERROR: ' + e.message); }
  }
} catch (e) {
  log('ERROR: ' + e.message);
}
</script>
</body>
</html>
